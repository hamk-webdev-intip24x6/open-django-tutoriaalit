{% extends 'base.html' %}
{% block content %}
    <div class="col-md-12">
        <h1>Gallery</h1>
        <p><a href="{% url 'gallery:image_upload' %}">Upload more images</a></p>
    </div>
    <div class="row">
        {% for post in posts %}
        <div class="col-md-4">
        <p>{{ post.description }}</p>
        <img src="{{ post.image.url }}" class="img-fluid" />
        <a href="{% url 'gallery:delete' post.pk %}">Delete</a>
        </div>
        {% endfor %}
    </div>
{% endblock %}
